[project]
name = "backend"
version = "0.1.0"
description = "VeriNews RSS collection API"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
